<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- GOLPE 오리지널 일러스트: 흑백 퍼팅 그린과 깃발 (브랜드·상표와 무관) -->
  <rect width="2400" height="1400" fill="#111111"/>
  <defs>
    <radialGradient id="glow" cx="72%" cy="62%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2400" height="1400" fill="url(#glow)"/>
  <!-- 그린 등고선 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <ellipse cx="1720" cy="1010" rx="980" ry="300" stroke-opacity="0.07" stroke-width="2"/>
    <ellipse cx="1720" cy="1010" rx="820" ry="250" stroke-opacity="0.09" stroke-width="2"/>
    <ellipse cx="1720" cy="1010" rx="660" ry="200" stroke-opacity="0.11" stroke-width="2"/>
    <ellipse cx="1720" cy="1010" rx="500" ry="152" stroke-opacity="0.14" stroke-width="2"/>
    <ellipse cx="1720" cy="1010" rx="340" ry="104" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="1720" cy="1010" rx="190" ry="58" stroke-opacity="0.24" stroke-width="2"/>
  </g>
  <!-- 홀컵 -->
  <ellipse cx="1720" cy="1010" rx="34" ry="11" fill="#000000" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <!-- 깃대와 깃발 -->
  <line x1="1720" y1="1008" x2="1720" y2="420" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
  <path d="M1722 424 L1930 486 L1722 548 Z" fill="#ffffff" fill-opacity="0.92"/>
  <!-- 공과 그림자 -->
  <ellipse cx="1462" cy="1102" rx="40" ry="9" fill="#000000" fill-opacity="0.6"/>
  <circle cx="1462" cy="1074" r="28" fill="#ffffff"/>
  <g fill="#111111" fill-opacity="0.12">
    <circle cx="1454" cy="1066" r="3"/><circle cx="1468" cy="1064" r="3"/><circle cx="1461" cy="1078" r="3"/>
    <circle cx="1474" cy="1077" r="3"/><circle cx="1448" cy="1080" r="3"/>
  </g>
  <!-- 퍼팅 라인 -->
  <path d="M1490 1068 C 1560 1050, 1640 1030, 1700 1014" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 14" stroke-linecap="round"/>
</svg>
